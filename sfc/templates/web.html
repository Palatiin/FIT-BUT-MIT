<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFC - Autoencoder NN</title>
	<style>
        label, input, select {
            display: block;
            margin-bottom: 1px;
        }
    </style>
</head>
<body>
    <h1>Soft Computing - Demonstration of Autoencoder Deep Neural Network Training</h1>
    <form id="trainForm" action="/train" method="post">
		<label for="hidden_layer_size">Hidden Layer Size:</label>
		<input type="number" id="hidden_layer_size" name="hidden_layer_size" required min="1" value=128><br>

		<label for="epochs">Epochs:</label>
		<input type="number" id="epochs" name="epochs" required min="0" value=10><br>

		<label for="learning_rate">Learning Rate:</label>
		<input type="number" step="0.00001" id="learning_rate" name="learning_rate" required min="0.0" max="1.0" value=0.2><br>

		<label for="activation_function">Activation Function of the Hidden Layer:</label>
		<select id="activation_function" name="hidden_layer_activation" required>
			<option value="ReLU">ReLU</option>
			<option value="Sigmoid">Sigmoid</option>
		</select><br>

        <button type="submit">Train</button>
    </form>
</body>
</html>
